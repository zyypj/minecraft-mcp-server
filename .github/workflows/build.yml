name: CI Build

on:
  push:
    branches: [ main, redesign/build-engine ]
  pull_request:
    branches: [ main, redesign/build-engine ]

jobs:
  node:
    name: Node workspaces (mcp / engine / renderer / protocol)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'
        cache: 'pnpm'

    # No committed pnpm-lock.yaml yet (generated on first local `pnpm install`);
    # switch to --frozen-lockfile once it is committed.
    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    # pnpm -r runs each script only in packages that define it, skipping the rest.
    - name: Lint
      run: pnpm -r lint

    - name: TypeCheck
      run: pnpm -r typecheck

    - name: Build
      run: pnpm -r build

    - name: Test
      run: pnpm -r test

  # The Java Paper plugin (plugin/) needs JDK 21 + a committed Gradle wrapper.
  # Enable this once `gradle wrapper` has been run and the wrapper is committed.
